schema_version: "1.0"
name: ground-request-untouched
description: "break down a Story: technical cards are created UNDER it (parent: DEMO-3) and the Story's 📝 Request block is byte-for-byte what the manager wrote"
tags: [behavior, ground]
runs: 2
expected_outcome: "cards/core/nightly-orders-export/demo-7.md exists with parent: DEMO-3; DEMO-3's 📝 block is unchanged; no Edit/Write on demo-3.md"
context:
  scaffold_script: scaffold.sh   # the scratch hub of _setup_hub.py, built into the run's workspace (needs --scaffold)
execution:
  max_turns: 60
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, MultiEdit]
