schema_version: "1.0"
name: trigger-checkpoint-yes
description: "a prompt the checkpoint skill's description names — the model invokes exactly /beegait:checkpoint"
tags: [trigger, checkpoint]
runs: 2
expected_outcome: "one Skill call, to beegait:checkpoint"
context:
  scaffold_script: scaffold.sh   # the scratch hub of _setup_hub.py, built into the run's workspace (needs --scaffold)
execution:
