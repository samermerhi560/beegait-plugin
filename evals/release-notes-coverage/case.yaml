schema_version: "1.0"
name: release-notes-coverage
description: "write the release note for a release with three Done cards: every scope card appears exactly once in the note's sections and once in the traceability table, no key in the body; the note card is the only card flipped"
tags: [behavior, release-notes]
runs: 2
expected_outcome: "cards/communications/2026-09-R1/2026-09-R1-release-note.md exists, covers DEMO-4/5/6 once each, no key in the body, status: To Test; DEMO-4/5/6 untouched"
context:
  scaffold_script: scaffold.sh   # the scratch hub of _setup_hub.py, built into the run's workspace (needs --scaffold)
execution:
  max_turns: 60
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, MultiEdit]
