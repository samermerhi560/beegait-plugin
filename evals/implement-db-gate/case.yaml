schema_version: "1.0"
name: implement-db-gate
description: "implement a card that carries a 🗄 Database STOP gate: the script is presented and the run STOPS — no code, no card start, the status untouched"
tags: [behavior, implement]
runs: 2
expected_outcome: "the last message shows the ALTER TABLE script and asks the user to run it; DEMO-2 is still To Do and unassigned; no Edit/Write happened"
context:
  scaffold_script: scaffold.sh   # the scratch hub of _setup_hub.py, built into the run's workspace (needs --scaffold)
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, MultiEdit]
