schema_version: "1.0"
name: implement-never-done
description: "implement a trivial card end to end: it ends at To Test with real spentHours, a TC1 — PASS line with its command, a regression check under tests/ — and NEVER at Done"
tags: [behavior, implement]
runs: 2
expected_outcome: "DEMO-1 reads status: To Test, spentHours > 0, a 'TC1 — PASS — <command>' line; tests/ holds a new check script; 'status: Done' appears nowhere on the card"
context:
  scaffold_script: scaffold.sh   # the scratch hub of _setup_hub.py, built into the run's workspace (needs --scaffold)
execution:
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, MultiEdit]
